name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-tests:
    name: Synthetic tests and CLI (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml
      - name: Install dependencies and source package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Test synthetic formats and rendering
        run: python -m pytest -q tests/test_containers.py tests/test_raster.py
      - name: Check CLI entry points
        run: |
          python -m sovereign_editor.cli --version
          python -m sovereign_editor.cli create --help
          python -m sovereign_editor.cli ui --help
